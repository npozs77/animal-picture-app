[project]
name = "animal-picture-app"
version = "0.1.0"
description = "Microservice that fetches and stores random animal pictures"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
